    UnequipItemResponse: { $ref-note: "沿用 inventory.schema.ts::unequipItemResponseSchema" }
    GetInventoryResponse: { $ref-note: "沿用 inventory.schema.ts::getInventoryResponseSchema" }
    DeleteItemResponse: { $ref-note: "沿用 inventory.schema.ts::deleteItemResponseSchema" }
