    ClaimQuestResponse: { $ref-note: "沿用 quest.schema.ts::claimQuestResponseSchema" }
    GetAchievementsResponse: { $ref-note: "沿用 quest.schema.ts::getAchievementsResponseSchema" }
    ClaimAchievementResponse: { $ref-note: "沿用 quest.schema.ts::claimAchievementResponseSchema" }
    GetLeaderboardResponse: { $ref-note: "沿用 leaderboard.schema.ts::getLeaderboardResponseSchema" }
    StartAdventureResponse: { $ref-note: "沿用 adventure.schema.ts::startAdventureResponseSchema" }
    GetCurrentAdventureResponse: { $ref-note: "沿用 adventure.schema.ts::getCurrentAdventureResponseSchema" }
    AdvanceAdventureResponse: { $ref-note: "沿用 adventure.schema.ts::advanceAdventureResponseSchema" }
    StartCombatResponse: { $ref-note: "沿用 adventure.schema.ts::startCombatResponseSchema" }
    ResolveEventRequest: { $ref-note: "沿用 adventure.schema.ts::resolveEventRequestSchema" }
    ResolveEventResponse: { $ref-note: "沿用 adventure.schema.ts::resolveEventResponseSchema" }
    SelectBlessingRequest: { $ref-note: "沿用 adventure.schema.ts::selectBlessingRequestSchema" }
