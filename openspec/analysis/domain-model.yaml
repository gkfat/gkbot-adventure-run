      背包（AGG-003）、排行榜更新（AGG-008 的 EVT-008）、任務/成就進度更新
      （AGG-006/AGG-007）。
    useCases: [UC-026]

businessRules:
  - id: RULE-001
    description: gold 與 gems 永遠落在 [0,100000) 範圍內，任何寫入路徑都需 clamp/拒絕超界寫入。
    appliesTo: [ENT-002]
    useCases: [UC-005, UC-007, UC-013, UC-015, UC-016, UC-026]
  - id: RULE-002
    description: 一個角色同時只能有一個進行中（非 ENDED）的 AdventureRun。
    appliesTo: [AGG-009]
    useCases: [UC-020]
  - id: RULE-003
    description: 角色等級上限為 30，達上限後不再增加。
    appliesTo: [ENT-002]
    useCases: [UC-004]
  - id: RULE-004
    description: 分配的屬性點總和不可超過 unspentAttributePoints，分配後立即扣除。
    appliesTo: [ENT-002, VO-001]
    useCases: [UC-005]
  - id: RULE-005
    description: 每個裝備槽位僅能有一件裝備；裝備到已佔用槽位需先取得玩家確認才能替換。
    appliesTo: [VO-003]
    useCases: [UC-009]
  - id: RULE-006
    description: run 背包上限 50 格、永久背包上限 500 格；超過上限的物品無法轉入（目前規則未定義滿倉時的處理，需另行補充，見 gap）。
    appliesTo: [ENT-005, AGG-009]
    useCases: [UC-010, UC-026]
  - id: RULE-007
    status: deprecated
    reason: 補血藥水改為一般消耗品，不再有角色等級解鎖限制（見 FR-016 deprecated 說明）。
    description: 補血藥水僅在 character.level >= 5 時可被帶入 run 使用。
    appliesTo: [VO-004]
    useCases: [UC-007, UC-025]
  - id: RULE-008
    status: deprecated
    reason: 補血藥水改為一般消耗品，不再有冷卻與每 run 攜帶上限（見 FR-018/FR-061 deprecated 說明）。
    description: 補血藥水每次帶入 run 後進入 30 分鐘冷卻，且每次 run 最多使用（帶入）1 瓶。
    appliesTo: [VO-004, AGG-009]
    useCases: [UC-025]
  - id: RULE-020
    description: >
      使用藥水（POTION）僅限 Rest 節點，且僅能消耗玩家自己持有（永久背包或
      run 背包）的 POTION 物品實體；回復量依該實體的 rolledStats.healPercent
      決定，不超過 HP_MAX。
    appliesTo: [ENT-003, AGG-009]
    useCases: [UC-025]
  - id: RULE-009
    description: 商店商品一旦標記 sold 即不可再次購買。
    appliesTo: [VO-006]
    useCases: [UC-013]
  - id: RULE-010
    description: 每日任務不允許 reroll；每個任務只能被領取一次。
    appliesTo: [VO-007]
    useCases: [UC-015]
  - id: RULE-011
    description: 每個成就每帳號只能領取一次。
    appliesTo: [VO-008]
    useCases: [UC-016]
  - id: RULE-012
    description: 排行榜項目只能由 server 於 run 結算時寫入，且只保留該帳號的歷史最高分。
    appliesTo: [ENT-009]
    useCases: [UC-019]
  - id: RULE-013
    description: 節點生成時，保底 Rest（距上次 Rest >= 4 step）優先於固定精英節奏（step%5、step%9）。
    appliesTo: [AGG-009]
    useCases: [UC-021]
  - id: RULE-014
    description: rngIndex 只能遞增，且每次消耗 random(seed, rngIndex) 後必須立即持久化遞增後的值，不可重複消耗同一 index。
    appliesTo: [AGG-009]
    useCases: [UC-031]
  - id: RULE-015
    description: RunModifier（Blessing/Curse）僅在建立它的 run 內有效，run 結束（ENDED）即全部失效，不可跨 run 生效。
    appliesTo: [VO-009, AGG-009]
    useCases: [UC-024, UC-028]
  - id: RULE-016
    description: 戰鬥進行中不接受任何玩家操作（無技能系統），僅能在戰鬥前後的節點互動。
    appliesTo: [AGG-009]
    useCases: [UC-027]
  - id: RULE-017
    description: Firestore security rules 預設拒絕所有直接 client 讀寫；僅限伺服器（Admin SDK）操作，或明確允許的使用者自身文件（如 AudioSettings）。
    appliesTo: [AGG-001, AGG-002, AGG-003, AGG-005, AGG-006, AGG-007, AGG-008, AGG-009]
    useCases: [UC-033]
  - id: RULE-018
    description: 刪除帳號必須完整刪除 Account/Character/Inventory/AdventureRun（含歷史）/Shop 個人商店紀錄/DailyQuestSet/AchievementBoard/LeaderboardEntry，不可留下孤兒資料；此為跨 aggregate 的一次性 saga，需保證最終完整性（可重試至完成）。
    appliesTo: [AGG-001, AGG-002, AGG-003, AGG-009, AGG-006, AGG-007, AGG-008]
    useCases: [UC-003]
  - id: RULE-019
    description: >
      裝備/卸下（EVT-004）為跨 aggregate 操作（同時涉及 AGG-002 與 AGG-003 或
      AGG-009）；application service 必須在同一次 API 請求內以 Firestore
      transaction 完成兩邊寫入，確保不會出現「角色顯示已裝備但背包物品狀態
      未同步」之類的中間不一致狀態。（使用藥水 EVT-014 已改為僅涉及 AGG-003/
      AGG-009，不再跨 AGG-002，見 EVT-014 與 RULE-020。）
    appliesTo: [AGG-002, AGG-003, AGG-009]
    useCases: [UC-009]
