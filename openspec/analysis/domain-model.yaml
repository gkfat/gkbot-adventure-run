aggregates:
  - id: AGG-001
    name: Account
    root: ENT-001
    members: [VO-012]
    rationale: >
      Account 是登入身份與帳號級偏好設定（音效開關）的一致性邊界，變動頻率低、
      與角色的高頻遊玩狀態明顯不同，故獨立成一個 aggregate。刪除帳號需連動刪除
      Character/Inventory/AdventureRun/Shop/DailyQuestSet/AchievementBoard/LeaderboardEntry，
      屬跨 aggregate 的一次性 saga（見 RULE-018），不代表這些都屬於同一 aggregate。
    useCases: [UC-001, UC-002, UC-003, UC-035]
  - id: AGG-002
    name: Character
    root: ENT-002
    members: [VO-001, VO-003]
    rationale: >
      Attributes 與 Equipment（槽位->itemId 引用）皆為角色核心狀態，彼此的規則
      互相耦合（例如升級同時發放屬性點、裝備替換需同時檢查槽位），必須在同一
      交易邊界內一起讀寫，避免中間狀態不一致。（VO-004 HealingPotion 已棄用，
      不再是本聚合成員，見其 deprecated 說明。）
    useCases: [UC-004, UC-005, UC-006, UC-009, UC-013, UC-026]
  - id: AGG-003
    name: Inventory
    root: ENT-005
    members: [ENT-003]
    rationale: >
      永久背包（500 格上限）需要獨立的一致性邊界來檢查容量與物品歸屬，
      與角色的高頻狀態變化（升級/裝備切換）分開，避免每次角色更新都鎖住整個背包。
      此處的 ENT-003 僅限 location=PERMANENT_INVENTORY 的實例；同一 itemId 在
      run 期間屬於 AGG-009，run 結算轉入永久背包時視為「跨聚合搬遷」（刪除於
      AGG-009、新建於 AGG-003），而非共享同一份資料。
    useCases: [UC-010, UC-026]
  - id: AGG-004
    name: ItemTemplate
    root: ENT-004
    members: []
    rationale: 靜態設定資料，生命週期獨立於玩家操作（由內容/開發流程維護），不與任何玩家交易共享一致性邊界。
    useCases: [UC-008]
  - id: AGG-005
    name: Shop
    root: ENT-006
    members: [VO-006]
    rationale: >
      同一份商店文件內的購買（檢查未售出 + 扣款 + 標記 sold）必須是原子操作，
      避免同一商品被兩個並發請求重複賣出；金幣商店與紅寶石商店是各自獨立的
      aggregate 實例（scope 不同）。
    useCases: [UC-011, UC-012, UC-013]
  - id: AGG-006
    name: DailyQuestSet
    root: ENT-007
    members: [VO-007]
    rationale: 一天三個任務作為單一一致性邊界，確保重置與領取都是對整組任務的原子操作，不會出現部分任務重置、部分未重置的狀態。
    useCases: [UC-014, UC-015]
  - id: AGG-007
    name: AchievementBoard
    root: ENT-008
    members: [VO-008]
    rationale: 每帳號一份成就進度集合，claim-once 規則需要在同一邊界內做原子檢查，避免重複領取。
    useCases: [UC-016]
  - id: AGG-008
    name: LeaderboardEntry
    root: ENT-009
    members: []
    rationale: 每帳號一筆，寫入時只需比較/更新自己帳號的最高分，帳號之間互不影響，不需要跨帳號交易，故每筆各自成一個 aggregate 實例。
    useCases: [UC-018, UC-019]
  - id: AGG-009
    name: AdventureRun
    root: ENT-010
    members: [ENT-003, VO-009, VO-010, VO-011]
    rationale: >
      Run 的狀態機、目前節點、run 背包（僅 location=RUN_INVENTORY 的 ItemInstance）、
      生效中的 RunModifier（Blessing/Curse）、rngIndex、稽核摘要，都必須在同一次
      checkpoint 呼叫中原子地一起推進——這正是 CTX-CON-002（checkpoint-driven，
      禁止 tick-based）所要求的單一寫入邊界，也是本遊戲變動最頻繁的一致性邊界。
    useCases: [UC-020, UC-021, UC-022, UC-023, UC-024, UC-025, UC-026, UC-027, UC-028, UC-029, UC-030, UC-031, UC-032]

