correctionsAppliedDuringValidation:
  - id: FIX-001
    description: FR-084（戰鬥回饋與結算畫面）原本沒有任何 use case 在 requirements 陣列中引用，屬 orphan FR。已將其加入 UC-023 與 UC-027 的 requirements 陣列。
    filesChanged: [use-cases.yaml]
  - id: FIX-002
    description: >
      data-model.yaml 的 DATA-008、DATA-009 的 domainModel 欄位誤用 AGG-006/AGG-007
      （aggregate id），違反共用規範第 3 節「data-model.yaml 的每筆項目 → domainModel: [ENT-...]」。
      已改為對應的 aggregate root entity：ENT-007、ENT-008。
    filesChanged: [data-model.yaml]
  - id: FIX-003
    description: >
      requirements.yaml 有 19 筆 FR/NFR 的 context 欄位誤填其他 FR id（例如
      FR-042 context:[FR-019]、NFR-004 context:[FR-012]），違反共用規範第 3 節
      「requirements.yaml 的每筆項目 → context: [CTX-...]」。已清空這些欄位
      （改為 []，其中一筆是 CTX 與 FR 混填，保留 CTX 部分）。FR 與 FR 之間的
      關聯性仍可從 description 文字與 use-cases.yaml 的分組看出，未遺失資訊。
    filesChanged: [requirements.yaml]

gaps:
  - type: change-coverage-gap
    id: API-027
    description: >
      2026-08-27 稽核發現：POST /api/adventure/rest/heal（UC-025）先前在
      /opsx:propose 拆分 10 個 changes 時未被任何 change 認領（proposal/tasks
      皆無提及），是遺漏而非刻意排除。已在同一次修訂中，隨補血藥水改為一般
      消耗品物品的設計變更，一併補進 adventure-run-core change（見該 change
      的 proposal.md/design.md/tasks.md）。
    severity: medium
    status: fixed
  - type: needs-review-marker
    id: FR-040
    description: enemyLevel > 30 時 combat 的 gems 掉落規則未定義（來源文件本身即標記 TBD，見 docs/15_待討論問題總整理.md）。
    severity: low
  - type: needs-review-marker
    id: FR-074
    description: 事件轉盤是否可付費加抽尚未定案，若啟用將影響經濟系統設計。
    severity: low
  - type: needs-review-marker
    id: FR-078
    description: Anti-cheat 目標強度與是否支援分享 seed 尚未定案。
    severity: low
  - type: needs-review-marker
    id: NFR-013
    description: Anti-cheat 目標強度的量測指標未量化。
    severity: low
  - type: needs-review-marker
    id: NFR-014
    description: Run history 長期保留策略（含是否改用 Google Sheet）的量測指標未量化。
    severity: low
  - type: needs-review-marker
    id: API-012
    description: >
      DELETE /inventory/{itemId}（捨棄物品）已存在於既有程式碼 schema
      （shared/schemas/api/inventory.schema.ts），但來源文件
      docs/05_物品與裝備系統.md 未描述丟棄機制，requirements.yaml 亦無對應 FR。
    severity: medium
    suggestedAction: 與相關人確認丟棄物品是否為既定需求；若是，需回頭於 system-analysis 補上對應 FR 並於 requirement-modeling 補上 use case。
  - type: design-deviation
    id: AGG-006-vs-DATA-008
    description: >
      domain-model.yaml 的 AGG-006 DailyQuestSet 以「一組 3 個任務」為單一
      一致性邊界，但 data-model.yaml（沿用既有實作）將每個任務存成獨立扁平文件
      （accountId+date+templateId），而非單一父文件。已在 data-model.yaml 頂部
      註記：以 application-level batch write 取代單文件原子性作為緩解。
    severity: medium
    suggestedAction: >
      若後續實作發現 batch write 不足以滿足一致性需求（例如需要嚴格禁止「重置到一半」的中間狀態被讀到），
      需回頭調整 domain-model.yaml 的 AGG-006 邊界定義或改為單一父文件設計。
  - type: nfr-not-directly-tagged
    id: NFR-008
    description: >
      Firestore security rules 預設拒絕（NFR-008）在功能面已由 UC-033/RULE-017
      覆蓋，但 api-model.yaml 與 data-model.yaml 內文都沒有直接標註 NFR-008。
    severity: low
    suggestedAction: 屬合理現象（安全規則不是 API operation 也不是資料表欄位），建議於 firestore.rules 檔案或部署檢查清單中另行追蹤，不需要修改 api-model/data-model 結構。
  - type: nfr-not-applicable-to-schema
    id: [NFR-010, NFR-012]
    description: >
      NFR-010（部署時 Firebase Admin 憑證載入）與 NFR-012（新端點需註冊 OpenAPI）
      本質是部署流程/工程紀律類 NFR，不會自然落在 API schema 或資料表欄位上。
    severity: low
    suggestedAction: 建議在部署 checklist / code review checklist 追蹤，而非要求 api-model.yaml/data-model.yaml 額外欄位。
  - type: intentional-non-coverage
    id: AGG-004
    description: ItemTemplate（AGG-004）刻意不透過任何 API 曝露 CRUD，因其為 repo 內靜態常數（CTX-CON-001），非 Firestore 動態資料。
    severity: low
    suggestedAction: 無需動作，已在 api-model.yaml 開頭註明。
  - type: dangling-reference
    id: none
    description: 未發現任何跨檔案的懸空引用（FR/UC/ENT/VO/AGG/EVT/RULE/API/DATA 互相引用皆可在來源檔案中找到對應項目）。
    severity: none
